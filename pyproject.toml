[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lankallm"
version = "0.1.0"
description = "Reproducible Sinhala and Tamil LLM reliability benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.110",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "mypy>=1.9",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
